name: Redraw

on:
  schedule:
    - cron: "7 19 * * 6"   # каждое воскресенье в 00:07 по Уфе (UTC+5)
  workflow_dispatch:        # ручной запуск: Actions → Redraw → Run workflow

permissions:
  contents: write

concurrency: redraw

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Перерисовать надпись
        run: python3 draw.py .

      - name: Отправить
        run: git push --force origin HEAD:main
